spring.application.name=agendador-barbearia

spring.datasource.url=jdbc:h2:file:./data/agendamentosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Valores padrao abaixo sao SOMENTE para desenvolvimento/teste
api.security.token.secret=${JWT_SECRET:chave-de-teste-nao-usar-em-producao}
api.admin.login=${ADMIN_LOGIN:barbeiro}
api.admin.password=${ADMIN_PASSWORD:barbeiro123}